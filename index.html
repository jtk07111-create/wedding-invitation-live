  const weekday = new Date(Date.UTC(Y, MO - 1, D)).getUTCDay();
  const koTime = (H < 12 ? '오전 ' : '오후 ') + (H % 12 || 12) + '시' + (MI ? ' ' + MI + '분' : '');
  const dotDate = Y + '.' + pad(MO) + '.' + pad(D);
  const koDay = '일월화수목금토'.charAt(weekday) + '요일';
  // 외국인 하객용 영어 날짜 (예: Saturday, February 13, 2027 · 6:30 PM)
  const enDate = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][weekday] + ', '
    + ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][MO - 1]
    + ` ${D}, ${Y} · ${H % 12 || 12}:${pad(MI)} ${H < 12 ? 'AM' : 'PM'}`;

  const photos = (W.photos.gallery || []).map(p => (typeof p === 'string' ? { src: p, thumb: p, pos: '' } : { src: p.src, thumb: p.thumb || p.src, pos: p.pos || '' }));
  const posStyle = pos => (pos ? ` style="object-position:${esc(pos)}"` : '');
  const tileItems = photos.length ? photos : W.draft ? [null, null, null, null, null, null, null] : [];
  const SHOW = W.gallery.show || 6;

  const label = t => `<h3 class="label">${esc(t)}</h3>`;

  /* ── 섹션 ── */
  const coverPhoto = has(W.photos.cover)
    ? `<figure class="cover__photo"><img class="fade-img" src="${esc(W.photos.cover)}" alt="${esc(W.groom.en)} & ${esc(W.bride.en)}"></figure>`
    : W.draft ? '<figure class="cover__photo"><span class="ph">Photo</span></figure>' : '';

  const cover = `
  <section class="cover" id="home">
    <div class="cover__text" data-reveal>
      <p class="invited">${esc(W.invited)}</p>
      <h1 class="names">${esc(W.groom.en)}<span class="amp">&amp;</span>${esc(W.bride.en)}</h1>
      <div class="cover__meta">
        <p class="meta">${dotDate} ${koTime}</p>
        <p class="meta">${esc(W.venue.name)}</p>
      </div>
    </div>
    ${coverPhoto}
  </section>`;

  const person = (role, p) => `
    <div class="person">
      <p class="person__name"><span>${role}</span><b>${esc(p.name)}</b></p>
      <p class="person__parents">${p.parents.filter(has).map(esc).join(p.parentsBreak ? ' ·<br>' : ' · ')} 의 ${esc(p.relation)}</p>
    </div>`;

  const intro = `
  <section class="intro">
    <div data-reveal>
      <p class="greeting">${esc(W.greeting)}</p>
      ${has(W.greetingKo) ? `<p class="greeting__ko">${lines(W.greetingKo)}</p>` : ''}
    </div>
    <div class="people" data-reveal>${person('신랑', W.groom)}${person('신부', W.bride)}</div>
  </section>`;

  const pl = W.playlist;
  const plPhoto = typeof W.photos.playlist === 'string' ? { src: W.photos.playlist, pos: '' } : (W.photos.playlist || {});
  const playlist = has(pl.songs) ? `
  <section class="playlist">
    <div class="playlist__bg">${has(plPhoto.src) ? `<img class="fade-img" src="${esc(plPhoto.src)}" alt=""${posStyle(plPhoto.pos)}>` : ''}</div>
    <div class="playlist__shade"></div>
    <div class="playlist__body" data-reveal>
      ${label(pl.title)}
      <ol class="songs">${pl.songs.map((s, i) => `<li>${i + 1}. ${esc(s)}</li>`).join('')}</ol>
      ${has(pl.more) ? `<p class="songs__more">${esc(pl.more)}</p>` : ''}
    </div>
  </section>` : '';

  function calendarCells() {
    const first = new Date(Date.UTC(Y, MO - 1, 1)).getUTCDay();
    const days = new Date(Date.UTC(Y, MO, 0)).getUTCDate();
    let html = ['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => `<span${i === 0 ? ' class="sun"' : ''}>${d}</span>`).join('');
    for (let i = 0; i < first; i++) html += '<span></span>';
    for (let d = 1; d <= days; d++) {
      const sun = (first + d - 1) % 7 === 0;
      html += d === D ? `<span class="is-wedding"><i>${d}</i></span>` : `<span${sun ? ' class="sun"' : ''}>${d}</span>`;
    }
    return html;
  }

  const calendar = `
  <section class="cal">
    <div data-reveal>
      <p class="cal__date">${dotDate}</p>
      <p class="cal__time">${koDay} ${koTime}</p>
      <p class="cal__en" lang="en">${enDate}</p>
      <div class="cal__grid" aria-label="${Y}년 ${MO}월 달력, ${D}일 예식">${calendarCells()}</div>
    </div>
  </section>`;

  const tileHtml = (p, i, moreCount) => {
    const inner = p ? `<img class="fade-img" src="${esc(p.thumb)}" alt=""${posStyle(p.pos)} loading="lazy" decoding="async">` : '<span class="ph">Photo</span>';
    const more = moreCount > 0 ? `<span class="tile__more"><b>+ ${moreCount}</b><small>More</small></span>` : '';
    const name = moreCount > 0 ? '사진 전체 보기' : `사진 ${i + 1} 크게 보기`;
    return `<button type="button" class="tile" data-i="${i}"${moreCount > 0 ? ' data-more="1"' : ''} aria-label="${name}">${inner}${more}</button>`;
  };

  const gallery = tileItems.length ? `
  <section class="gallery" id="gallery">
    <div data-reveal>
      ${label(W.gallery.title)}
      <div class="grid" data-stagger>${tileItems.slice(0, SHOW).map((p, i) => tileHtml(p, i, i === SHOW - 1 ? tileItems.length - SHOW : 0)).join('')}</div>
    </div>
  </section>` : '';

  const v = W.venue;
  const venuePhoto = has(v.photo)
    ? `<figure class="venue__photo"><img class="fade-img" src="${esc(v.photo)}" alt="${esc(v.photoAlt || '')}" loading="lazy" decoding="async"></figure>`
    : '';
  const venue = `
  <section class="venue" id="venue">
    <div data-reveal>
      ${label('The Venue')}
      ${v.photoAt === 'top' ? venuePhoto : ''}
      <h4 class="venue__name">${esc(v.name)}</h4>
      <p class="venue__line">${esc(v.address)}</p>
      ${has(v.tel) ? `<p class="venue__line"><a href="tel:${v.tel.replace(/[^0-9]/g, '')}">${esc(v.tel)}</a></p>` : ''}
      ${v.photoAt === 'map' ? venuePhoto : ''}
      ${has(v.mapImage)
        ? `<div class="mapbox mapbox--img"><img class="fade-img" src="${esc(v.mapImage)}" alt="${esc(v.mapAlt || '오시는 길 약도')}" loading="lazy" decoding="async"></div>`
        : `<div class="mapbox">${ICON.pin}<span>Map Preview</span></div>`}
      <div class="maplinks">${v.maps.map(m => `<a class="mapbtn" href="${esc(m.url)}" target="_blank" rel="noopener"><span class="mapbtn__ko">${esc(m.label)}${ICON.out}</span>${m.en ? `<span class="mapbtn__en">${esc(m.en)}</span>` : ''}</a>`).join('')}</div>
      ${has(v.mapTip) ? `<p class="maptip" lang="en">${lines(v.mapTip)}</p>` : ''}
      <div class="ways">${W.ways.map(w => `<div class="way"><h5>[ ${esc(w.title)} ]</h5><p>${lines(w.text)}</p>${has(w.en) ? `<p class="way__en" lang="en"><span>${esc(w.en)}</span>${lines(w.enText)}</p>` : ''}</div>`).join('')}</div>
    </div>
  </section>`;

  const acctRows = list => list.map(a => `
      <div class="acct">
        <div><p class="acct__name">${esc(a.name)}</p><p class="acct__num">${esc(a.bank)}&nbsp;&nbsp;<span class="acct__digits">${esc(a.number)}</span></p></div>
        <button type="button" class="copy" data-copy="${esc(a.number.replace(/[^0-9]/g, ''))}" data-bank="${esc(a.bank)}" aria-label="${esc(a.name)} 계좌번호 복사">${ICON.copy}</button>
      </div>`).join('');

  const RG = W.registry;
  const registryOn = !!(RG && has(RG.paypal));
  const registryHtml = registryOn ? `
      <div class="registry" lang="en">
        <p class="label">${esc(RG.label)}</p>
        ${has(RG.image) ? `<figure class="registry__img"><img class="fade-img" src="${esc(RG.image)}" alt="${esc(RG.imageAlt || '')}" loading="lazy" decoding="async"></figure>` : ''}
        <button type="button" class="registry__btn" id="openFund"><span class="registry__title">${esc(RG.title)}</span><span class="registry__sub">Gift any amount · PayPal</span></button>
      </div>` : '';
  const accountSide = (title, list) => (has(list) ? `<details class="acc"><summary>${title}${ICON.chev}</summary>${acctRows(list)}</details>` : '');

  const account = has(W.accounts.groom) || has(W.accounts.bride) ? `
  <section class="account" id="account">
    <div data-reveal>
      ${label('Account')}
      <p class="account__lead">${esc(W.accountLead)}</p>
      <div class="accs">${accountSide('신랑측 계좌번호', W.accounts.groom)}${accountSide('신부측 계좌번호', W.accounts.bride)}</div>
      ${registryHtml}
    </div>
  </section>` : '';

  const share = `
  <section class="share">
    <div data-reveal>
      <span class="share__rule"></span>
      ${label('Share')}
      <p class="share__text">${esc(W.share.text)}</p>
      <div class="share__btns">
        <button type="button" class="share__btn" id="shareKakao"><i>${ICON.bubble}</i><span>Kakao</span></button>
        <button type="button" class="share__btn" id="shareLink"><i>${ICON.link}</i><span>Link</span></button>
      </div>
    </div>
  </section>`;

  const app = $('#app');
  app.innerHTML = cover + intro + playlist + calendar + gallery + venue + account + share;

  // 사진은 다 받은 다음 서서히 나타난다
  function fadeImages(scope) {
    scope.querySelectorAll('img.fade-img').forEach(img => {
      const show = () => img.classList.add('is-loaded');
      if (img.complete && img.naturalWidth) show();
      else { img.addEventListener('load', show); img.addEventListener('error', show); }
    });
  }
  fadeImages(app);

  /* ── 안내 문구와 복사 ── */
  const toastEl = $('#toast');
  let toastTimer = 0;
  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, ms || 2400);
  }
  // 탭하는 순간 바로 실행되는 예전 방식. 새 방식이 막힌 iOS 인앱 브라우저에서도 동작한다.
  function legacyCopy(text) {
    const active = doc.activeElement;
    const ta = doc.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px;';
    doc.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = doc.execCommand('copy'); } catch (e) { ok = false; }
    doc.body.removeChild(ta);
    if (active && active.focus) active.focus();
    return ok;
  }
  // 같은 탭 안에서 두 방식을 모두 시도한다. 둘 다 막히면 번호를 선택해 두어 길게 눌러 복사할 수 있게 한다.
  function copy(text, msg, selectEl) {
    const legacyOk = legacyCopy(text);
    const done = ok => {
      if (ok) return toast(msg);
      if (selectEl) {
        const range = doc.createRange();
        range.selectNodeContents(selectEl);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
      toast('자동 복사가 막혀 있어요. 길게 눌러 복사해 주세요: ' + text, 5000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), () => done(legacyOk));
    else done(legacyOk);
  }

  /* ── 겹쳐 뜨는 창: 스크롤 잠금과 초점 돌려주기 ── */
  let locks = 0;
  function lock(on) {
    locks = Math.max(0, locks + (on ? 1 : -1));
    root.style.overflow = locks ? 'hidden' : '';
    doc.body.style.overflow = locks ? 'hidden' : '';
  }
  const stack = [];
  const LEAVE_MS = { menu: 300, gpage: 400, lb: 250, fund: 300 };
  function openLayer(el, opener, focusSel) {
    el.classList.remove('is-leaving');
    el.hidden = false;
    lock(true);
    stack.push({ el, opener });
    const f = $(focusSel, el);
    if (f) f.focus();
  }
  function closeLayer(el) {
    let i = stack.length - 1;
    while (i >= 0 && stack[i].el !== el) i--;
    if (el.hidden || i < 0) return;
    const opener = stack[i].opener;
    stack.splice(i, 1);
    lock(false);
    if (opener && opener.focus) opener.focus();
    if (reduceMotion) { el.hidden = true; return; }
    // 원본처럼 닫을 때도 서서히 사라진 뒤 숨긴다
    el.classList.add('is-leaving');
    setTimeout(() => {
      if (!el.classList.contains('is-leaving')) return;
      el.classList.remove('is-leaving');
      el.hidden = true;
    }, LEAVE_MS[el.id] || 250);
  }

  /* ── 상단 막대: 표지를 벗어나면 주황 배경 ── */
  const bar = $('#bar');
  const onScroll = () => bar.classList.toggle('is-solid', (window.pageYOffset || root.scrollTop) > 24);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* ── 메뉴 ── */
  const menu = $('#menu');
  const menuBtn = $('#menuOpen');
  if (!tileItems.length) $('#menuGallery').hidden = true;
  menuBtn.addEventListener('click', () => { menuBtn.setAttribute('aria-expanded', 'true'); openLayer(menu, menuBtn, '.menu__close'); });
  menu.addEventListener('click', e => {
    const b = e.target.closest('[data-menu]');
    if (!b) return;
    menuBtn.setAttribute('aria-expanded', 'false');
    closeLayer(menu);
    if (b.dataset.menu === 'home') window.scrollTo({ top: 0, behavior: 'smooth' });
    if (b.dataset.menu === 'gallery') openGpage(menuBtn);
  });

  /* ── 갤러리 전체 보기 ── */
  const gpage = $('#gpage');
  $('#gpageTitle').textContent = W.gallery.title;
  $('#gpageGrid').innerHTML = tileItems.map((p, i) => tileHtml(p, i, 0)).join('');
  fadeImages($('#gpageGrid'));
  function openGpage(opener) { openLayer(gpage, opener, '.gpage__close'); }
  gpage.addEventListener('click', e => {
    if (e.target.closest('[data-gpage]')) return closeLayer(gpage);
    const t = e.target.closest('.tile');
    if (t) showPhoto(+t.dataset.i, t);
  });

  /* ── 사진 크게 보기 ── */
  const lb = $('#lb');
  const lbImg = $('#lbImg');
  const lbStage = $('#lbStage');
  let lbIndex = 0;
  function renderLb() {
    lbImg.src = photos[lbIndex].src;
    lbImg.alt = `사진 ${lbIndex + 1}`;
    $('#lbCount').textContent = `${lbIndex + 1} / ${photos.length}`;
  }
  function showPhoto(i, opener) {
    if (!photos.length) return toast('사진이 들어오면 크게 볼 수 있어요');
    lbIndex = i;
    renderLb();
    openLayer(lb, opener, '.lb__close');
  }
  function stepLb(n) { lbIndex = (lbIndex + n + photos.length) % photos.length; renderLb(); }
  lb.addEventListener('click', e => {
    const b = e.target.closest('[data-lb]');
    if (b) {
      if (b.dataset.lb === 'close') closeLayer(lb);
      else stepLb(b.dataset.lb === 'next' ? 1 : -1);
    } else if (e.target === lbStage) closeLayer(lb);
  });
  let sx = null, sy = 0;
  lbStage.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  lbStage.addEventListener('touchend', e => {
    if (sx === null) return;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) stepLb(dx < 0 ? 1 : -1);
  });

  /* ── Honeymoon Fund: 금액을 고르면 PayPal이 그 금액을 채운 채로 열린다 ── */
  const fundEl = $('#fund');
  const fundInput = $('#fundAmount');
  const fundGift = $('#fundGift');
  const fundNote = $('#fundNote');
  const fundAmount = () => {
    const n = parseFloat(String(fundInput.value).replace(/[^0-9.]/g, ''));
    return n > 0 && n <= 10000 ? Math.round(n * 100) / 100 : 0;
  };
  function syncFund() {
    const n = fundAmount();
    fundGift.href = n ? `${RG.paypal.replace(/\/+$/, '')}/${n}${RG.currency}` : RG.paypal;
    fundGift.setAttribute('aria-disabled', n ? 'false' : 'true');
    fundEl.querySelectorAll('.fund__amt').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.amt === n)));
    return n;
  }
  if (registryOn) {
    $('#fundLabel').textContent = RG.label;
    $('#fundTitle').textContent = RG.title;
    $('#fundText').textContent = RG.text;
    $('#fundAmounts').innerHTML = RG.amounts.map(a => `<button type="button" class="fund__amt" data-amt="${a}" aria-pressed="false">$${a}</button>`).join('');
    syncFund();
    fundEl.addEventListener('click', e => {
      if (e.target === fundEl || e.target.closest('[data-fund="close"]')) return closeLayer(fundEl);
      const chip = e.target.closest('.fund__amt');
      if (chip) { fundInput.value = chip.dataset.amt; fundNote.textContent = ''; syncFund(); }
    });
    fundInput.addEventListener('input', () => { fundNote.textContent = ''; syncFund(); });
    fundGift.addEventListener('click', e => {
      if (!syncFund()) {
        e.preventDefault();
        fundNote.textContent = 'Please choose or enter an amount.';
        return;
      }
      setTimeout(() => closeLayer(fundEl), 300);
      toast('Opening PayPal. Thank you so much!');
    });
  }
  function openFund(opener) {
    fundNote.textContent = '';
    openLayer(fundEl, opener, '.fund__close');
  }

  /* ── 공유 ── */
  const pageUrl = () => W.share.url || location.href.split('#')[0];
  function shareNative() {
    const data = { title: W.share.title, text: W.share.description, url: pageUrl() };
    if (navigator.share) {
      navigator.share(data).catch(err => { if (!err || err.name !== 'AbortError') copy(pageUrl(), '링크를 복사했어요. 카카오톡에 붙여 넣어 주세요.'); });
    } else copy(pageUrl(), '링크를 복사했어요. 카카오톡에 붙여 넣어 주세요.');
  }

  /* ── 본문 버튼 ── */
  app.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.classList.contains('tile')) return t.dataset.more ? openGpage(t) : showPhoto(+t.dataset.i, t);
    if (t.dataset.copy) return copy(t.dataset.copy, `${t.dataset.bank} 계좌번호를 복사했어요`, t.parentNode.querySelector('.acct__digits'));
    if (t.id === 'openFund') return openFund(t);
    if (t.id === 'shareKakao') return shareNative();
    if (t.id === 'shareLink') return copy(pageUrl(), '링크가 복사되었습니다');
  });

  /* ── 배경음악 ── */
  const bgm = $('#bgm');
  const audio = $('#bgmAudio');
  const setBgmIcon = playing => {
    bgm.innerHTML = playing ? ICON.pause : ICON.play;
    bgm.setAttribute('aria-pressed', playing ? 'true' : 'false');
    bgm.setAttribute('aria-label', playing ? '배경음악 멈춤' : '배경음악 재생');
  };
  if (has(W.bgm) || W.draft) {
    bgm.hidden = false;
    setBgmIcon(false);
    if (has(W.bgm)) audio.src = W.bgm;
    audio.addEventListener('play', () => setBgmIcon(true));
    audio.addEventListener('pause', () => setBgmIcon(false));
    bgm.addEventListener('click', () => {
      if (!has(W.bgm)) return toast('배경음악 파일(mp3)을 넣으면 여기서 재생됩니다');
      if (audio.paused) audio.play().catch(() => toast('배경음악을 재생하지 못했어요'));
      else audio.pause();
    });
  }

  /* ── Esc 로 맨 위 창 닫기 ── */
  doc.addEventListener('keydown', e => {
    if (!stack.length) return;
    const top = stack[stack.length - 1].el;
    if (e.key === 'Escape') {
      if (top === menu) menuBtn.setAttribute('aria-expanded', 'false');
      closeLayer(top);
    } else if (top === lb && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) stepLb(e.key === 'ArrowRight' ? 1 : -1);
  });

  /* ── 스크롤하면 떠오르기: 원본과 같은 값. 섹션은 화면 안쪽 5%, 갤러리는 10%에 들어오면 한 번만.
        원본처럼 글꼴을 다 받은 뒤에 시작한다 (최대 3초 기다림) ── */
  if ('IntersectionObserver' in window && !reduceMotion) {
    root.classList.add('can-reveal');
    app.querySelectorAll('[data-stagger]').forEach(grid => {
      Array.prototype.forEach.call(grid.children, (child, i) => { child.style.transitionDelay = (i * 0.12).toFixed(2) + 's'; });
    });
    const watch = (sel, margin) => {
      const io = new IntersectionObserver(entries => {
        entries.forEach(en => {
          if (en.isIntersecting) { en.target.classList.add('is-in'); io.unobserve(en.target); }
        });
      }, { rootMargin: margin });
      app.querySelectorAll(sel).forEach(el => io.observe(el));
    };
    let started = false;
    const start = () => {
      if (started) return;
      started = true;
      watch('[data-reveal]', '-5%');
      watch('[data-stagger]', '-10%');
    };
    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(start, start);
    else start();
    setTimeout(start, 3000);
  }
})();
</script>

</body>
</html>
